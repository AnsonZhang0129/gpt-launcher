<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GPT Launcher</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--surface,#181818);color:#f4f1ed;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button{font:inherit;color:inherit;cursor:pointer}#handoff-veil{position:fixed;inset:0;z-index:1;background:var(--surface,#181818);pointer-events:none;opacity:1}#stage{position:fixed;inset:0;z-index:2}canvas{display:block}#loading{position:fixed;inset:0;display:grid;place-items:center;color:#9d99a4;z-index:6}#controls{position:fixed;bottom:25px;left:28px;right:28px;display:flex;align-items:center;justify-content:space-between;gap:14px;z-index:4;font-size:11px;color:#9c98a4;transition:opacity .4s}#controls button{background:#ffffff08;border:1px solid #ffffff12;padding:8px 12px;border-radius:30px;transition:background .2s}#controls button:hover{background:#ffffff18;color:#fff}.buttons{display:flex;align-items:center;gap:7px}label{display:flex;align-items:center;gap:5px;margin:0 8px;cursor:pointer}input{accent-color:#c4addc}#status{font-size:12px;letter-spacing:.08em}#time{font-variant-numeric:tabular-nums;opacity:.55}#progress{width:60px;height:2px;accent-color:#998eb0;border:0}#destination{position:fixed;inset:0;z-index:0;opacity:0;transform:scale(.2);transform-origin:center;background:var(--surface,#181818);display:flex}.sidebar{width:210px;border-right:1px solid #ffffff09;padding:30px 22px;background:#151515;color:#76727e;font-size:12px}.brand{font-weight:600;color:#e7e1ee;font-size:17px;margin-bottom:45px}.nav{padding:11px 13px;margin:5px 0;border-radius:9px}.nav.active{background:#ffffff08;color:#d8d1df}.section{font-size:10px;letter-spacing:.12em;margin:30px 13px 12px;color:#58545f}.main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:50px}.eyebrow{font-size:10px;letter-spacing:.3em;color:#ab8cba;margin-bottom:22px}h1{font-weight:400;letter-spacing:-.045em;font-size:clamp(27px,4vw,53px);margin:0 0 13px}.sub{font-size:13px;color:#77727f;margin-bottom:42px}.composer{width:min(600px,90%);border:1px solid #ffffff13;background:#ffffff04;box-shadow:0 25px 80px #0003;border-radius:22px;padding:23px;color:#756f7e;font-size:14px}.composer-bottom{margin-top:35px;display:flex;justify-content:space-between;font-size:12px}.send{background:#e3daeb;color:#332d38;border-radius:50%;width:26px;height:26px;display:grid;place-items:center}.footnote{margin-top:28px;color:#57515e;font-size:10px;letter-spacing:.12em}#again{margin-top:25px;background:none;border:0;color:#b7a2c5;font-size:12px}.arrived #status{letter-spacing:0;font-size:11px}@media(max-width:800px){.sidebar{display:none}#controls{bottom:18px;left:15px;right:15px;flex-direction:column;gap:12px}.buttons{flex-wrap:wrap;justify-content:center}#status{font-size:10px}.buttons button{padding:7px 10px}label{font-size:10px}.main{padding:20px}}body[data-state="entering"] #controls{opacity:0;pointer-events:none}
.native #destination,.native .buttons,.native #time,.native #progress{display:none}#status{display:none}.native #controls{display:none}.native.revealing,.native.revealing html{background:transparent}html:has(body.native.revealing){background:transparent}.native[data-state="entering"] #controls{display:none}#controls{display:none}.validation-error{display:grid;place-items:center;padding:32px;text-align:center;font-size:16px;color:#e9d6d6}
html[data-theme="light"]{color-scheme:light}html[data-theme="dark"]{color-scheme:dark}
[data-theme="light"] body{color:#171717}
[data-theme="light"] .sidebar{background:#f9f9f9;border-color:#0000000d;color:#666}
[data-theme="light"] .brand,[data-theme="light"] .nav.active{color:#171717}
[data-theme="light"] .nav.active{background:#00000006}
[data-theme="light"] .composer{background:#f4f4f4;border-color:#e9e9e9;color:#666;box-shadow:0 16px 60px #00000009}
[data-theme="light"] .sub,[data-theme="light"] .footnote{color:#777}
[data-theme="light"] .send{background:#252525;color:#fff}
</style></head><body><div id="loading"></div><main id="destination"><aside class="sidebar"><div class="brand">◌ &nbsp; ChatGPT</div><div class="nav active" data-i18n="newIdea"></div><div class="nav" data-i18n="search"></div><div class="section" data-i18n="yourSpace"></div><div class="nav" data-i18n="learn"></div><div class="nav" data-i18n="build"></div><div class="nav" data-i18n="notes"></div></aside><section class="main"><div class="eyebrow" data-i18n="ideas"></div><h1 id="welcome-title">Welcome.</h1><div class="sub" data-i18n="startIdea"></div><div class="composer"><span data-i18n="composer"></span><div class="composer-bottom"><span data-i18n="addIdea"></span><span class="send">↑</span></div></div><div class="footnote" data-i18n="previewNote"></div><button id="again" data-i18n="again"></button></section></main><div id="handoff-veil"></div><div id="stage"></div><div id="controls"><div><span id="status" data-i18n="writing"></span> &nbsp; <span id="time"></span> <input id="progress" data-i18n-label="progress" type="range" min="0" max="24" step="0.01" value="0"></div><div class="buttons"><button id="replay" data-i18n="replay"></button><button id="pause" data-i18n="pause"></button><button id="slow" data-i18n="slow"></button><label><input id="hold" type="checkbox"><span data-i18n="hold"></span></label><button id="ready" data-i18n="simulateReady"></button><button id="fullscreen" data-i18n="fullscreen"></button></div></div><script>window.addEventListener('error',e=>{window.splashError=e.message;window.webkit?.messageHandlers?.splash?.postMessage('renderFailed')});__APP__</script></body></html>
