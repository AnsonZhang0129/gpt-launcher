<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GPT Launcher · 审查预览</title><style>
*{box-sizing:border-box}body{margin:0;background:#181818;color:#f1f0f2;font-family:-apple-system,BlinkMacSystemFont,sans-serif;height:100vh;display:grid;grid-template-rows:76px 1fr}header{display:flex;align-items:center;justify-content:space-between;padding:0 30px;border-bottom:1px solid #ffffff10}h1{font-size:17px;font-weight:600;margin:0}.label{font-size:11px;color:#9b96a3;letter-spacing:.08em;margin-top:5px}.badge{font-size:11px;color:#beb4d0;border:1px solid #ffffff15;padding:7px 10px;border-radius:20px}main{display:grid;grid-template-columns:288px 1fr;min-height:0}aside{padding:38px 26px;background:#1c1c1c;border-right:1px solid #ffffff0c;display:flex;flex-direction:column;gap:17px}h2{font-size:22px;font-weight:500;letter-spacing:-.02em;margin:0}p{font-size:12px;line-height:1.8;color:#a4a0a9;margin:0}label{font-size:12px;color:#ccc7d2;display:block;margin-bottom:9px}input{width:100%;border:1px solid #ffffff25;border-radius:9px;padding:12px;background:#242424;color:#fff;font:17px -apple-system,BlinkMacSystemFont,sans-serif;outline:none}input:focus{border-color:#b0a1cb;box-shadow:0 0 0 3px #a693cf19}button{font:12px -apple-system,BlinkMacSystemFont,sans-serif;cursor:pointer;border:1px solid #ffffff16;color:#c9c4ce;background:#ffffff06;padding:9px 12px;border-radius:8px}button:hover{background:#ffffff10}.primary{background:#e8e1f2;color:#292131;border:0;padding:13px;font-weight:600}.primary:hover{background:#f2ecfa}.examples{display:flex;gap:7px;flex-wrap:wrap}.error{font-size:11px;color:#f0a9a9;min-height:30px;line-height:1.5}.actions{display:flex;gap:8px}.details{margin-top:auto;font-size:11px;color:#89838f;line-height:1.8}.preview{position:relative;min-width:0;min-height:0;display:flex;flex-direction:column}iframe{border:0;flex:1;width:100%;min-height:0}.playback{height:55px;border-top:1px solid #ffffff0c;display:flex;align-items:center;gap:8px;padding:0 20px}.state{margin-left:auto;color:#8e8896;font-size:11px}@media(max-width:740px){main{grid-template-columns:1fr;grid-template-rows:auto 1fr}aside{padding:15px;display:block;border:0}aside h2,aside p,.details,.examples{display:none}aside input{width:60%;display:inline-block}aside .primary{width:35%;margin-left:3%}aside label{display:none}.error{min-height:15px}.preview{min-height:320px}header{height:60px;padding:0 18px}body{grid-template-rows:60px 1fr}}

.themes{display:flex;gap:7px;margin-bottom:18px}.themes button{flex:1}.themes button[aria-pressed="true"]{border-color:#b3a6c7;background:#b3a6c722}
body.light{background:#fff;color:#171717}body.light aside{background:#f9f9f9;border-color:#eee}body.light header,body.light .playback{border-color:#eee}body.light p,body.light .details,body.light .state,body.light label,body.light .label{color:#666}body.light input{background:#fff;border-color:#ddd;color:#171717}body.light button{color:#444;border-color:#ddd;background:#00000004}body.light button.primary{background:#292131;color:white}body.light .badge{color:#666;border-color:#ddd}body.light .error{color:#b3261e}
</style></head><body><header><div><h1>GPT Launcher</h1><div class="label">让每一次打开，都从你的名字开始</div></div><div class="badge">macOS · 发布前审查</div></header><main><aside><h2>你的名字，<br>你的开场。</h2><p>沿用已经打磨的彩带字体。<br>输入名字，看看它如何被写出来。</p><div><label>外观</label><div class="themes"><button data-theme="dark" aria-pressed="true">深色</button><button data-theme="light" aria-pressed="false">浅色</button></div></div><form id="form"><label for="name">显示名称</label><input id="name" value="Alex Morgan" maxlength="48" autocomplete="off" spellcheck="false" aria-describedby="error"><div class="error" id="error" role="status"></div><button class="primary" type="submit">预览我的开场</button></form><div class="examples"><button data-name="Mia">Mia</button><button data-name="Oliver">Oliver</button><button data-name="Sophie Chen">Sophie Chen</button><button data-name="William Montgomery">长名字</button></div><div class="details">支持英文字母与空格，最多 24 个字符。<br>正式应用将名字保存在本机。<br>此页面仅预览，不会打开 ChatGPT。</div></aside><section class="preview"><iframe title="启动动画预览" id="preview" src="Animation.html?name=Alex%20Morgan"></iframe><div class="playback"><button id="replay">重播</button><button id="pause">暂停</button><button id="slow">¼ 慢放</button><span class="state" id="state">书写中</span></div></section></main><script>
const input=document.querySelector('#name'),frame=document.querySelector('#preview'),err=document.querySelector('#error');let slow=false,paused=false,current='Alex Morgan',theme='dark';
function play(){const name=input.value.replace(/ +/g,' ').trim();if(!/^[A-Za-z ]+$/.test(name)||name.length>24){err.textContent='请输入 1–24 个英文字母或空格，暂不支持其他字符。';input.focus();return}input.value=current=name;err.textContent='';paused=slow=false;document.querySelector('#pause').textContent='暂停';document.querySelector('#slow').textContent='¼ 慢放';document.querySelector('#state').textContent='书写中';frame.src='Animation.html?name='+encodeURIComponent(name)+'&theme='+theme+'&v='+Date.now()}
document.querySelectorAll('[data-theme]').forEach(b=>b.onclick=()=>{theme=b.dataset.theme;document.body.classList.toggle('light',theme==='light');document.querySelectorAll('[data-theme]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));play()});
document.querySelector('#form').onsubmit=e=>{e.preventDefault();play()};document.querySelectorAll('[data-name]').forEach(b=>b.onclick=()=>{input.value=b.dataset.name;play()});document.querySelector('#replay').onclick=play;
document.querySelector('#pause').onclick=()=>{frame.contentDocument.querySelector('#pause')?.click();paused=!paused;document.querySelector('#pause').textContent=paused?'继续':'暂停'};
document.querySelector('#slow').onclick=()=>{frame.contentDocument.querySelector('#slow')?.click();slow=!slow;document.querySelector('#slow').textContent=slow?'1× 常速':'¼ 慢放'};
addEventListener('message',e=>{if(e.source!==frame.contentWindow||e.data?.type!=='launcher-state')return;const words={loaded:'书写中',waiting:'呼吸 · 准备进入',entering:'穿洞渐显',complete:'预览完成'};if(words[e.data.event])document.querySelector('#state').textContent=words[e.data.event]});
</script></body></html>
